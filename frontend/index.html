<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Museum of You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sage:#778873; --sage-lt:#A1BC98; --linen:#DCCFC0; --cream:#FDF6ED;
  --ink:#3a3630; --ink2:#6b6259; --ink3:#a09588; --ink4:#c8bfb5;
  --panel:#f4ece0; --panel2:#ede3d4; --border:rgba(119,136,115,0.18); --border2:rgba(119,136,115,0.35);
  --wall:#e8ddd0; --floor:#c8b89a; --ceiling:#f0e8dc;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:#1a1612;color:var(--ink)}

/* ═══════════════════════════════════════
   MUSEUM 3D SCENE
═══════════════════════════════════════ */
#museum-scene{
  position:fixed;inset:0;
  perspective:900px;
  perspective-origin:50% 42%;
  /* Backdrop behind the 3D scene — visible only outside the room box (e.g.
     past the open entrance). Warm lit-gallery tone with vertical board seams
     and a soft spotlight so any glimpse reads as ambiance, not a flat void.
     As the perspective container's own background it sits behind ALL 3D
     content and can never occlude the frames. */
  background:
    repeating-linear-gradient(90deg, rgba(255,240,210,0.05) 0 1px, transparent 1px 120px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 119px 120px, transparent 120px 240px),
    radial-gradient(ellipse 60% 48% at 50% 40%, rgba(120,98,72,0.45) 0%, rgba(60,49,38,0.7) 55%, rgba(30,24,18,0.92) 100%),
    linear-gradient(180deg, #4a3d2f 0%, #2e251c 50%, #1d1711 100%);
}
/* Soft vignette for depth + ambient mood */
#museum-scene::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:40;
  background:radial-gradient(ellipse 78% 72% at 50% 44%, transparent 52%, rgba(20,15,11,0.55) 100%);
}

#camera{
  width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(0.77,0,0.175,1);
  transform:translateZ(0px) translateX(0px) rotateY(0deg);
}

/* The room box — 2000(W) × 1200(H) × 1800(D), centered at origin */
#room{
  position:absolute;
  width:2000px;height:1200px;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  transform-style:preserve-3d;
}

.room-face{position:absolute;left:50%;top:50%;transform-style:preserve-3d}

/* Back wall — z=-900, faces +z */
#wall-back{
  width:2000px;height:1200px;
  background:
    repeating-linear-gradient(90deg, rgba(90,70,50,0.06) 0 1px, transparent 1px 200px),
    linear-gradient(180deg, transparent 63%, rgba(120,95,65,0.22) 63%, rgba(120,95,65,0.22) 64.4%, transparent 64.4%),
    linear-gradient(180deg, transparent 63%, rgba(170,150,120,0.16) 63%, rgba(170,150,120,0.16) 100%),
    linear-gradient(180deg, var(--ceiling) 0%, var(--wall) 34%, var(--wall) 100%);
  transform:translate(-50%,-50%) translateZ(-900px);
  border-bottom:3px solid rgba(90,70,50,0.15);
}
/* Left wall — x=-1000, faces +x (INTERIOR). An inward-facing wall: its front
   face points into the room, so a viewer standing inside and turning to face
   it sees a solid interior wall surface (not the wall's back/exterior). */
#wall-left{
  width:1800px;height:1200px;
  background:
    repeating-linear-gradient(90deg, rgba(90,70,50,0.06) 0 1px, transparent 1px 200px),
    linear-gradient(180deg, transparent 63%, rgba(120,95,65,0.22) 63%, rgba(120,95,65,0.22) 64.4%, transparent 64.4%),
    linear-gradient(180deg, transparent 63%, rgba(170,150,120,0.16) 63%, rgba(170,150,120,0.16) 100%),
    linear-gradient(180deg, var(--ceiling) 0%, #ddd0c0 34%,#ddd0c0 100%);
  transform:translate(-50%,-50%) rotateY(90deg) translateZ(-1000px);
  /* FLAT (not preserve-3d): the wall's frame CHILDREN flatten onto the wall
     plane, so they still paint on top of the opaque wall bg (children render
     above their parent) — giving us readable, correctly-oriented frames on a
     solid interior surface. Meanwhile a flat wall quad sorts as a single plane
     against the floor/ceiling just like the original flat walls did, which
     keeps the front corners sealed (preserve-3d on a depth-spanning side wall
     broke that sort order and opened triangular voids at the entry corners). */
  transform-style:flat;
}
/* Right wall — x=+1000, faces -x (INTERIOR). Same inward-facing fix. */
#wall-right{
  width:1800px;height:1200px;
  background:
    repeating-linear-gradient(90deg, rgba(90,70,50,0.06) 0 1px, transparent 1px 200px),
    linear-gradient(180deg, transparent 63%, rgba(120,95,65,0.22) 63%, rgba(120,95,65,0.22) 64.4%, transparent 64.4%),
    linear-gradient(180deg, transparent 63%, rgba(170,150,120,0.16) 63%, rgba(170,150,120,0.16) 100%),
    linear-gradient(180deg, var(--ceiling) 0%, #ddd0c0 34%,#ddd0c0 100%);
  transform:translate(-50%,-50%) rotateY(-90deg) translateZ(-1000px);
  transform-style:flat; /* see #wall-left: flat keeps corners sealed + frames on top */
}
/* Dark accent walls — legacy decorative panels (currently no markup uses
   these classes; side walls are now opaque interior surfaces, so nothing is
   revealed "through" them). Kept for easy re-introduction as a design accent. */
.accent-wall{
  width:1800px;height:1200px;
  background:
    repeating-linear-gradient(90deg, rgba(255,240,210,0.025) 0 1px, transparent 1px 160px),
    radial-gradient(ellipse 70% 50% at 50% 40%, rgba(90,75,58,0.5) 0%, rgba(45,38,30,0.85) 70%, rgba(28,23,18,1) 100%),
    linear-gradient(180deg, #4a3f32 0%, #2f271f 55%, #211b15 100%);
}
#accent-left{ transform:translate(-50%,-50%) rotateY(-90deg) translateZ(1030px); }
#accent-right{ transform:translate(-50%,-50%) rotateY(90deg) translateZ(1030px); }
/* Floor — y=+600, faces up. Planks run along room depth. */
#floor{
  width:2000px;height:1800px;
  background:
    repeating-linear-gradient(0deg, rgba(60,42,24,0.16) 0 1.5px, transparent 1.5px 6px, rgba(60,42,24,0.07) 6px 7px, transparent 7px 150px),
    repeating-linear-gradient(90deg, rgba(255,250,235,0.025) 0 2px, transparent 2px 150px),
    linear-gradient(180deg,#b8a888 0%,#988868 100%);
  transform:translate(-50%,-50%) rotateX(90deg) translateZ(-600px);
}
/* Ceiling — y=-600, faces down. Recessed light fixtures. */
#ceiling{
  width:2000px;height:1800px;
  background:
    radial-gradient(ellipse 120px 70px at 22% 50%, rgba(255,250,235,0.7) 0%, rgba(255,250,235,0.15) 45%, transparent 70%),
    radial-gradient(ellipse 120px 70px at 50% 50%, rgba(255,250,235,0.7) 0%, rgba(255,250,235,0.15) 45%, transparent 70%),
    radial-gradient(ellipse 120px 70px at 78% 50%, rgba(255,250,235,0.7) 0%, rgba(255,250,235,0.15) 45%, transparent 70%),
    linear-gradient(180deg,var(--cream) 0%,var(--ceiling) 100%);
  transform:translate(-50%,-50%) rotateX(-90deg) translateZ(-600px);
}

/* Baseboard / crown trim */
#wall-back::before,#wall-left::before,#wall-right::before{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:60px;background:rgba(90,70,50,0.08);border-top:2px solid rgba(90,70,50,0.12);
}
#wall-back::after,#wall-left::after,#wall-right::after{
  content:'';position:absolute;top:0;left:0;right:0;
  height:50px;background:rgba(255,255,255,0.2);border-bottom:2px solid rgba(255,255,255,0.3);
}

/* Spotlight effect on floor */
#floor::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(253,246,237,0.3) 0%,transparent 70%);
}

/* ═══════════════════════════════════════
   EXHIBIT FRAMES on walls
═══════════════════════════════════════ */
.exhibit-frame{
  position:absolute;
  left:50%;top:50%;
  width:360px;height:300px;
  cursor:pointer;
  transform-style:preserve-3d;
}

/* Frame border (wooden molding only — transparent fill so the mat shows) */
.exhibit-frame .frame-border{
  position:absolute;inset:0;
  border:10px solid #8a7458;
  border-radius:3px;
  box-shadow:
    inset 0 0 0 2px rgba(255,240,200,0.3),
    0 8px 32px rgba(0,0,0,0.4),
    0 2px 8px rgba(0,0,0,0.3);
  background:transparent;
  z-index:1;
}
/* Frame inner mat */
.exhibit-frame .frame-mat{
  position:absolute;inset:10px;
  background:var(--panel);
  overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:16px;
  z-index:2;
}
/* Gallery label below frame */
.exhibit-frame .frame-label{
  position:absolute;
  bottom:-44px;left:50%;transform:translateX(-50%);
  font-family:'DM Mono',monospace;font-size:9px;
  color:rgba(253,246,237,0.6);letter-spacing:0.18em;
  text-transform:uppercase;white-space:nowrap;
  text-align:center;
}
/* Spotlight cone on wall above */
.exhibit-frame::before{
  content:'';position:absolute;
  top:-220px;left:50%;transform:translateX(-50%);
  width:120px;height:200px;
  background:radial-gradient(ellipse 100% 100% at 50% 0%,rgba(253,246,237,0.25) 0%,transparent 100%);
  pointer-events:none;
}

/* Frame wall placements are set via inline transforms (see markup).
   Geometry: room is 2000(W)×1200(H)×1800(D), origin at center.
   back wall z=-900, left wall x=-1000, right wall x=+1000, floor y=+600. */

/* Frame thumbnail content */
.frame-thumb-title{
  font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;
  color:var(--ink);text-align:center;margin-bottom:6px;line-height:1.2;
}
.frame-thumb-num{
  font-family:'DM Mono',monospace;font-size:8px;color:var(--sage);
  letter-spacing:0.2em;text-transform:uppercase;margin-bottom:10px;
}
.frame-thumb-sub{font-size:10px;color:var(--ink3);text-align:center;line-height:1.4}
.frame-thumb-icon{font-size:28px;margin-bottom:8px}

/* ═══════════════════════════════════════
   UPLOAD KIOSK (3D panel floating center)
═══════════════════════════════════════ */
#upload-kiosk{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:100;
  transition:opacity 0.8s ease, filter 0.8s ease;
}
#upload-kiosk.hidden{opacity:0;pointer-events:none}

.kiosk-panel{
  background:var(--cream);
  width:480px;max-height:85vh;overflow-y:auto;
  border-radius:4px;
  padding:40px 40px 32px;
}
